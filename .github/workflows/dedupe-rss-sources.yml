name: Städa dubbla RSS-källor

on:
  workflow_dispatch:

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sätt upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Installera functions-beroenden
        run: npm ci --prefix functions

      - name: Skriv Google service account-nyckel till fil
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcp-key.json

      - name: Stäng av källor som delar RSS-feed med en annan källa
        working-directory: functions
        run: npm run dedupe-rss-sources
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
