name: Deploy (manuell)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Vad ska deployas?"
        required: true
        default: "hosting"
        type: choice
        options:
          - hosting
          - functions
          - hosting,functions
          - firestore:rules
          - hosting,functions,firestore:rules

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sätt upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Installera root-beroenden
        run: npm ci

      - name: Installera functions-beroenden
        run: npm ci --prefix functions

      - name: Typkontrollera frontend
        run: npm run typecheck

      - name: Typkontrollera functions
        run: npm run typecheck --prefix functions

      - name: Skapa .env.local från GitHub Secrets
        run: |
          cat > .env.local << EOF
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          RSS_FEED_1=${{ secrets.RSS_FEED_1 }}
          RSS_FEED_2=${{ secrets.RSS_FEED_2 }}
          EOF

      - name: Bygg frontend (statisk export till .next/standalone)
        if: contains(github.event.inputs.target, 'hosting')
        run: npm run build

      - name: Installera Firebase CLI
        run: npm install -g firebase-tools

      - name: Skriv Google service account-nyckel till fil
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcp-key.json

      - name: Deploya
        run: firebase deploy --only ${{ github.event.inputs.target }} --project "${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
          FIREBASE_SUPPRESS_REGION_WARNING: "true"
