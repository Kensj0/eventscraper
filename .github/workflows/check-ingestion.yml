name: Kontrollera ingestion

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sätt upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Installera functions-beroenden
        run: npm ci --prefix functions

      - name: Trigga ingestRSSFeedsManual
        run: |
          curl -sf \
            "https://europe-west1-${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}.cloudfunctions.net/ingestRSSFeedsManual?key=test-local" \
            --max-time 300

      - name: Trigga ingestSvenskaKyrkanEventsManual
        run: |
          curl -sf \
            "https://europe-west1-${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}.cloudfunctions.net/ingestSvenskaKyrkanEventsManual?key=test-local" \
            --max-time 300

      - name: Trigga scrapeHTMLSources
        run: |
          curl -sf \
            "https://europe-west1-${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}.cloudfunctions.net/scrapeHTMLSources?key=test-local" \
            --max-time 300

      - name: Skriv Google service account-nyckel till fil
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcp-key.json

      # continue-on-error på var och en av de tre kontrollerna nedan — de är
      # tre oberoende diagnoser (rss/svenska-kyrkan-calendar/html). Innan
      # detta stoppade en anomali i EN typ (t.ex. RSS:s kända em-dash-bugg,
      # se kallupptackt-pipeline-minnet) hela jobbet innan de andra två ens
      # hann köras, vilket dolde om HTML-ingestionen (ny 2026-09-13) faktiskt
      # fungerade eller inte.
      - name: Kontrollera senaste RSS-ingestion-logg
        working-directory: functions
        run: npm run check-ingestion
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
          CHECK_TYPE: rss

      - name: Kontrollera senaste Svenska kyrkan-ingestion-logg
        working-directory: functions
        run: npm run check-ingestion
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
          CHECK_TYPE: svenska-kyrkan-calendar

      - name: Kontrollera senaste HTML-ingestion-logg
        working-directory: functions
        run: npm run check-ingestion
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
          CHECK_TYPE: html
