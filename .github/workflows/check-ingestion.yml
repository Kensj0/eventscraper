name: Kontrollera ingestion

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sätt upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Installera functions-beroenden
        run: npm ci --prefix functions

      - name: Trigga ingestRSSFeedsManual
        run: |
          curl -sf \
            "https://europe-west1-${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}.cloudfunctions.net/ingestRSSFeedsManual?key=test-local" \
            --max-time 300

      - name: Skriv Google service account-nyckel till fil
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcp-key.json

      - name: Kontrollera senaste ingestion-logg
        working-directory: functions
        run: npm run check-ingestion
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
